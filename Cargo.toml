[package]
name = "stomp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Track storage and compute use per research grant on HPC systems"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.21"
jiff = { version = "1.0.0", features = ["serde"] }
md-5 = "0.11.0"
rayon = "1.12.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rustix = { version = "1.1.6", features = ["fs", "process", "system"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
signal-hook = "0.4.6"
tar = "0.4.46"
thiserror = "2.0.21"
toml = "1.2.1"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
xattr = "1.7.0"
zstd = { version = "0.14.4", features = ["zstdmt"] }

[dev-dependencies]
tempfile = "3.27.0"
tiny_http = "0.12.0"
