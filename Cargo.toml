[package]
name = "stomp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Track storage and compute use per research grant on HPC systems"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
jiff = { version = "1.0.0", features = ["serde"] }
rayon = "1.12.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rustix = { version = "1.1.6", features = ["fs", "system"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"
xattr = "1.7.0"

[dev-dependencies]
tempfile = "3.27.0"
