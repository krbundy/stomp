# Pushing a tag like v0.2.0 builds the static x86_64 Linux binary, runs the
# tests against it, and publishes a GitHub release with the binary and its
# SHA-256. The asset names don't carry the version, so
# https://github.com/krbundy/stomp/releases/latest/download/stomp-x86_64-linux
# always fetches the newest release.
#
# Running the workflow by hand (Actions > Release > Run workflow) builds and
# tests without releasing; the binary is kept as a workflow artifact.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the static binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but Cargo.toml has version $version."
            exit 1
          fi

      # The same build as on a workstation: the pinned Rust Alpine image in
      # Docker, tests first, and a refusal if the result isn't static.
      - name: Test and build on musl
        run: scripts/build-static.sh --test

      - name: Name the release files
        run: |
          mkdir release
          cp dist/stomp-*-x86_64-linux release/stomp-x86_64-linux
          cd release
          sha256sum stomp-x86_64-linux > stomp-x86_64-linux.sha256
          ./stomp-x86_64-linux --version

      - uses: actions/upload-artifact@v7
        with:
          name: stomp-x86_64-linux
          path: release/
          if-no-files-found: error

  publish:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: stomp-x86_64-linux
          path: release

      # A tag with a suffix, like v0.2.0-rc.1, makes a pre-release, which
      # releases/latest skips.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=
          case $TAG in *-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" \
            --title "stomp ${TAG#v}" --generate-notes --verify-tag $prerelease
